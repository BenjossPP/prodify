<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#080810"/>

  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
    </pattern>
    <radialGradient id="orb1" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="80%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="40%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#orb1)"/>
  <rect width="1200" height="630" fill="url(#orb2)"/>

  <!-- Top shimmer line -->
  <rect x="300" y="0" width="600" height="1" fill="url(#textGrad)" opacity="0.4"/>

  <!-- Logo icon -->
  <rect x="548" y="185" width="64" height="64" rx="16" fill="url(#logoGrad)"/>
  <!-- Tag icon simplified -->
  <path d="M576 203 L580 203 L592 215 L580 227 L568 227 L568 215 Z M574 211 a2 2 0 1 0 4 0 a2 2 0 1 0 -4 0" fill="white" opacity="0.9"/>

  <!-- ShopScribe wordmark -->
  <text x="600" y="298" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="42" font-weight="700" fill="white" text-anchor="middle" letter-spacing="-1">ShopScribe</text>

  <!-- Tagline gradient text -->
  <text x="600" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="700" fill="url(#textGrad)" text-anchor="middle" letter-spacing="-1.5">Fiches produits en 10 sec</text>

  <!-- Subtitle -->
  <text x="600" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="400" fill="rgba(255,255,255,0.5)" text-anchor="middle">Titres SEO · Descriptions · Bullet points · Tags — propulsé par GPT-4o</text>

  <!-- Badges row -->
  <rect x="340" y="450" width="155" height="40" rx="20" fill="rgba(139,92,246,0.15)" stroke="rgba(139,92,246,0.3)" stroke-width="1"/>
  <text x="418" y="475" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="rgba(196,181,253,0.9)" text-anchor="middle">3 générations gratuites</text>

  <rect x="515" y="450" width="115" height="40" rx="20" fill="rgba(139,92,246,0.15)" stroke="rgba(139,92,246,0.3)" stroke-width="1"/>
  <text x="573" y="475" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="rgba(196,181,253,0.9)" text-anchor="middle">6 langues</text>

  <rect x="650" y="450" width="205" height="40" rx="20" fill="rgba(139,92,246,0.15)" stroke="rgba(139,92,246,0.3)" stroke-width="1"/>
  <text x="753" y="475" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="rgba(196,181,253,0.9)" text-anchor="middle">Sans abonnement</text>

  <!-- Bottom domain -->
  <text x="600" y="570" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="rgba(255,255,255,0.2)" text-anchor="middle">shopscribe-ai.com</text>
</svg>
